events {
    worker_connections 1024;
}

http {
    # 日志配置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 基础配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # WebSocket 超时配置
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    # HTTP 服务器（用于 Let's Encrypt 验证和重定向到 HTTPS）
    server {
        listen 80;
        server_name your-domain.com;  # 修改为您的域名

        # Let's Encrypt 验证路径
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 重定向所有其他请求到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 服务器
    server {
        listen 443 ssl http2;
        server_name your-domain.com;  # 修改为您的域名

        # SSL 证书配置
        ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;  # 修改为您的域名
        ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;  # 修改为您的域名
        
        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # WebSocket 信令服务器代理
        location /signaling {
            proxy_pass http://mctier-signaling:8445;
            proxy_http_version 1.1;
            
            # WebSocket 升级头
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 代理头配置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时配置
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # 健康检查端点
        # 注意：信令服务器只提供 WebSocket 服务，没有 HTTP 健康检查路由，
        # 因此这里由 Nginx 直接返回，仅用于确认反向代理本身存活。
        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # 根路径
        location / {
            return 200 'MCTier Signaling Server is running';
            add_header Content-Type text/plain;
        }
    }
}
