name: quality

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install supported Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --no-self-update

      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check

      - name: Check compilation
        run: cargo +1.85.0 check --locked

      - name: Run tests
        run: cargo +1.85.0 test --locked
