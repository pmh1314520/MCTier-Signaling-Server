[package]
name = "mctier-signaling-server"
version = "2.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
