services:
  # MCTier 信令服务器
  #
  # 本文件只负责信令容器本身。反向代理与 TLS 证书由部署者在宿主机自行处理
  # （nginx / caddy / 云厂商负载均衡皆可），仓库不再内置 Nginx + Certbot：
  # 证书与域名属于部署环境的私有配置，塞进 compose 只会和各自的既有网关打架。
  mctier-signaling:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mctier-signaling
    restart: unless-stopped
    # 端口映射：默认仅绑定本机回环地址
    # 部署者需自行配置反向代理（nginx/caddy）和 TLS 证书
    ports:
      - "127.0.0.1:8445:8445"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - BIND_ADDRESS=0.0.0.0:8445
      - MINIMUM_CLIENT_VERSION=${MINIMUM_CLIENT_VERSION:-3.0.0}
      - CLIENT_DOWNLOAD_URL=${CLIENT_DOWNLOAD_URL:-https://mctier.pmhs.top}
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-4096}
      - MAX_CONNECTIONS_PER_SOURCE=${MAX_CONNECTIONS_PER_SOURCE:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - COMMUNITY_NODES_FILE=/app/data/community_nodes.json
      - COMMUNITY_NODE_CAPACITY=${COMMUNITY_NODE_CAPACITY:-200}
      - COMMUNITY_NODE_ALLOW_PRIVATE_TARGETS=${COMMUNITY_NODE_ALLOW_PRIVATE_TARGETS:-false}
    # 用户投稿的共享节点存档：用命名卷持久化，容器重建后投稿不丢失
    volumes:
      - mctier-signaling-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f mctier-signaling-server > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mctier-signaling-data:

networks:
  default:
    name: mctier-network
